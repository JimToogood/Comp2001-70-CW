tags:
  - Trails
summary: Delete an existing trail
description: Delete an existing trail.
parameters:
  - name: user-credentials
    in: header
    type: string
    required: true
    description: User credentials, format = email::password
  - name: trail_id
    in: path
    required: true
    description: ID of trail to be deleted
    schema:
      type: integer
responses:
  200:
    description: Trail deleted successfully
  400:
    description: Invalid user credentials format
  401:
    description: Missing user credentials
  403:
    description: Verification failed/Auth server error
  404:
    description: Trail does not exist
  500:
    description: Internal server error

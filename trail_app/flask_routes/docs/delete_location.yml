tags:
  - Locations
summary: Delete an existing location
description: Delete an existing location.
parameters:
  - name: user-credentials
    in: header
    type: string
    required: true
    description: User credentials, format = email::password
  - name: location_id
    in: path
    required: true
    description: ID of location to be deleted
    schema:
      type: integer
responses:
  200:
    description: Location deleted successfully
  400:
    description: Invalid user credentials format
  401:
    description: Missing user credentials
  403:
    description: Verification failed/Auth server error
  404:
    description: Location does not exist
  409:
    description: Cannot delete location as it is still referenced in Trails
  500:
    description: Internal server error

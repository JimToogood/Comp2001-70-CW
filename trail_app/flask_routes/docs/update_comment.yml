tags:
  - Comments
summary: Update an existing comment
description: Update the content field of an existing comment.
parameters:
  - name: user-credentials
    in: header
    type: string
    required: true
    description: User credentials, format = email::password
  - name: comment_id
    in: path
    required: true
    description: ID of comment to be updated
    schema:
      type: integer
  - name: body
    in: body
    required: true
    schema:
      type: object
      properties:
        content:
          type: string
          description: New content of comment
responses:
  200:
    description: Comment updated successfully
  400:
    description: Invalid user credentials format
  401:
    description: Missing user credentials
  403:
    description: Verification failed/Auth server error/Only admins can edit other peoples comments
  404:
    description: Comment/User does not exist
  500:
    description: Internal server error

tags:
  - Comments
summary: Delete an existing comment
description: Delete an existing comment.
parameters:
  - name: user-credentials
    in: header
    type: string
    required: true
    description: User credentials, format = email::password
  - name: comment_id
    in: path
    required: true
    description: ID of comment to be deleted
    schema:
      type: integer
responses:
  200:
    description: Comment deleted successfully
  400:
    description: Invalid user credentials format
  401:
    description: Missing user credentials
  403:
    description: Verification failed/Auth server error
  404:
    description: Comment does not exist
  500:
    description: Internal server error

tags:
  - Trails
summary: Retrieve all or a single trail(s)
description: Retrieve all trails or a single trail if trail_id is provided.
parameters:
  - name: user-credentials
    in: header
    type: string
    required: true
    description: User credentials, format = email::password
  - name: trail_id
    in: path
    required: false
    description: Optional ID of trail to retrieve
    schema:
      type: integer
responses:
  200:
    description: A list of trails or a single trail
    schema:
      type: array
      items:
        type: object
        properties:
          trail_id:
            type: integer
          trail_name:
            type: string
          distance:
            type: number
            format: float
          elevation_gain:
            type: number
            format: float
          estimated_time:
            type: number
            format: float
          route_type:
            type: string
          difficulty:
            type: string
          location_id:
            type: integer
  400:
    description: Invalid user credentials format
  401:
    description: Missing user credentials
  403:
    description: Verification failed/Auth server error
  404:
    description: Trail does not exist
  500:
    description: Internal server error

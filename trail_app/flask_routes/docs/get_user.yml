tags:
  - Users
summary: Retrieve all or a single user(s)
description: Retrieve all users or a single user if user_id is provided.
parameters:
  - name: user-credentials
    in: header
    type: string
    required: true
    description: User credentials, format = email::password
  - name: user_id
    in: path
    required: false
    description: Optional ID of user to retrieve
    schema:
      type: integer
responses:
  200:
    description: A list of users or a single user
    schema:
      type: array
      items:
        type: object
        properties:
          user_id:
            type: integer
          user_name:
            type: string
          email:
            type: string
          role:
            type: string
  400:
    description: Invalid user credentials format
  401:
    description: Missing user credentials
  403:
    description: Verification failed/Auth server error
  404:
    description: User does not exist
  500:
    description: Internal server error

tags:
  - Locations
summary: Update an existing location
description: Update the name of an existing location.
parameters:
  - name: user-credentials
    in: header
    type: string
    required: true
    description: User credentials, format = email::password
  - name: location_id
    in: path
    required: true
    description: ID of location to be updated
    schema:
      type: integer
  - name: body
    in: body
    required: true
    schema:
      type: object
      properties:
        location_name:
          type: string
          description: New name of location
responses:
  200:
    description: Location updated successfully
  400:
    description: Invalid user credentials format
  401:
    description: Missing user credentials
  403:
    description: Verification failed/Auth server error
  404:
    description: Location does not exist
  409:
    description: Location with that name already exists
  500:
    description: Internal server error

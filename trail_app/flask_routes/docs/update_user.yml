tags:
  - Users
summary: Update an existing user
description: Update an existing user only specifying the values you want to update.
parameters:
  - name: user-credentials
    in: header
    type: string
    required: true
    description: User credentials, format = email::password
  - name: user_id
    in: path
    required: true
    description: ID of user to be updated
    schema:
      type: integer
  - name: body
    in: body
    required: true
    schema:
      type: object
      properties:
        email:
          type: string
          description: New email of user
        role:
          type: string
          description: New role of user
responses:
  200:
    description: User updated successfully
  400:
    description: Invalid user credentials format
  401:
    description: Missing user credentials
  403:
    description: Verification failed/Auth server error/Cannot update your own account
  404:
    description: User does not exist
  409:
    description: Email already exists
  500:
    description: Internal server error

tags:
  - Comments
summary: Create a new comment
description: Create a new comment.
parameters:
  - name: user-credentials
    in: header
    type: string
    required: true
    description: User credentials, format = email|password
  - name: body
    in: body
    required: true
    schema:
      type: object
      required:
        - trail_id
        - content
      properties:
        trail_id:
          type: integer
          description: ID of trail being commented on
        content:
          type: string
          description: Content of comment
responses:
  201:
    description: Comment successfully created
  400:
    description: Missing required inputs/Invalid user credentials format
  401:
    description: Missing user credentials
  403:
    description: Verification failed/Auth server error
  404:
    description: Trail/User does not exist
  500:
    description: Internal server error
